# Release-candidate build (RELEASE_CANDIDATE_0.1.0.md, B.5-B.8).
#
# Builds the official release-candidate tarball with `R CMD build .` from the
# exact commit in a clean GitHub-hosted environment, records the commit SHA,
# R version, runner OS, file name and SHA256 (annotation and job summary),
# inspects the tarball, installs it into an empty library and runs a smoke
# test, runs the citation/DOI/version audit and the FULL manuscript
# validation, and uploads the tarball, its checksum and the logs as an
# artifact. It runs on release-* branches and on main (so that the release
# merge commit is built and gated). It never tags or publishes anything;
# publish-release.yml reuses this artifact for a tag on a gated commit.

name: release-candidate

on:
  push:
    branches: ['release-*', 'main']
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_REPO_URL: https://github.com/bioinformatics-sannio/postexport-kinetics.git
  R_KEEP_PKG_SOURCE: yes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Record R provenance
        run: Rscript tools/ci/record_r_provenance.R "release-candidate build"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::expm, any::data.table, any::deSolve

      - name: Build release tarball (R CMD build .)
        run: |
          test -z "$(git status --porcelain)"
          R CMD build .

      - name: Record build provenance and SHA256
        run: |
          T=$(ls postexportKinetics_*.tar.gz)
          S=$(sha256sum "$T" | cut -d' ' -f1)
          echo "$S  $T" > "$T.sha256"
          RV=$(Rscript -e 'cat(R.version.string, "|", R.version$platform)')
          OS="$RUNNER_OS $(lsb_release -ds 2>/dev/null) ($ImageOS $ImageVersion)"
          echo "::notice title=Release-candidate tarball::commit $GITHUB_SHA | $RV | runner $OS | $T | sha256 $S"
          {
            echo "### Release-candidate tarball"
            echo ""
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- R: \`$RV\`"
            echo "- runner: \`$OS\`"
            echo "- file: \`$T\`"
            echo "- sha256: \`$S\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect tarball (hygiene)
        run: |
          Rscript tools/ci/inspect_tarball.R postexportKinetics_*.tar.gz 2>&1 | tee inspect_tarball.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "TARBALL INSPECTION PASSED" inspect_tarball.log && echo "::notice title=Tarball inspection::PASSED"

      - name: Clean installation smoke test
        run: |
          Rscript tools/ci/smoke_install.R postexportKinetics_*.tar.gz 2>&1 | tee smoke_install.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "SMOKE TEST PASSED" smoke_install.log && echo "::notice title=Clean installation::SMOKE TEST PASSED"

      - name: Citation, DOI and version audit
        run: |
          Rscript tools/ci/citation_audit.R 2>&1 | tee citation_audit.log
          test "${PIPESTATUS[0]}" -eq 0
          echo "::notice title=Citation audit::$(tail -1 citation_audit.log)"

      - name: Full manuscript validation (not --quick)
        run: |
          git clone --quiet "$FROZEN_REPO_URL" "$RUNNER_TEMP/postexport-kinetics"
          Rscript tools/validate_against_manuscript.R --frozen-repo "$RUNNER_TEMP/postexport-kinetics" 2>&1 | tee validate_against_manuscript_full.log
          test "${PIPESTATUS[0]}" -eq 0
          STATUS=$(grep "Scientific equivalence status" validate_against_manuscript_full.log)
          echo "::notice title=Full manuscript validation::$STATUS"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            postexportKinetics_*.tar.gz
            postexportKinetics_*.tar.gz.sha256
            inspect_tarball.log
            smoke_install.log
            citation_audit.log
            validate_against_manuscript_full.log
          if-no-files-found: warn
          retention-days: 90
