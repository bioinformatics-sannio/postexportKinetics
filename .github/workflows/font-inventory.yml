# DIAGNOSTIC (branch experiment/png-fonts only): font and PNG-device
# inventory for the vignette-determinism work. Not for merge.
name: font-inventory
on:
  push:
    branches: ['experiment/png-fonts']
permissions:
  contents: read
jobs:
  linux-bioc-devel:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:devel
    steps:
      - uses: actions/checkout@v5
      - name: Inventory
        run: Rscript tools/ci/font_inventory.R "bioc-devel container"
      - name: Install package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          Rscript -e 'BiocManager::install(c("remotes", "png"), ask = FALSE, update = FALSE); remotes::install_deps(dependencies = NA, repos = BiocManager::repositories(), upgrade = "never")'
          R CMD INSTALL .
      - name: Text/grob probe (figure 5, 15 fresh processes)
        run: Rscript tools/ci/text_probe.R 15
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: release }
      - name: Inventory
        run: Rscript tools/ci/font_inventory.R "macOS runner"
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: release }
      - name: Inventory
        run: Rscript tools/ci/font_inventory.R "Windows runner"
