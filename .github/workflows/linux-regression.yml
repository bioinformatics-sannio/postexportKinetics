# Linux validation of the ported numerical core.
#
# Regression levels (tools/frozen/README.md):
#   A. same-platform package vs frozen: strict, blocking;
#   B. cross-platform scientific regression: scale-aware, blocking;
#   C. extreme-conditioning fixtures and bootstrap draws across platforms:
#      reported, not blocking.
#
# package:           install; package tests against the committed fixtures
#                    (level B/C on Linux); R CMD check.
# frozen-reference:  verify the tag; export it (read-only); recompute frozen
#                    outputs on the COMMITTED inputs (no deSolve
#                    regeneration); package tests against them (level A);
#                    cross-platform frozen comparison (level B/C);
#                    diagnostics; verify the frozen clone is unchanged.

name: linux-regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_REPO_URL: https://github.com/bioinformatics-sannio/postexport-kinetics.git
  FROZEN_TAG: manuscript-revision-v1.0
  FROZEN_COMMIT: 65c3b7368fb7686bfde3dab857f98c393bb534c5
  R_KEEP_PKG_SOURCE: yes

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::testthat, any::expm
          needs: check

      - name: Session and linear-algebra provenance
        run: |
          Rscript -e 'print(sessionInfo()); print(La_library()); print(La_version()); print(extSoftVersion()["BLAS"]); print(RNGkind())'

      - name: Install package
        run: R CMD INSTALL .

      - name: Deterministic regression tests (committed fixtures)
        run: Rscript tools/ci/run_tests_ci.R

      - uses: r-lib/actions/check-r-package@v2
        if: always()
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: false

  frozen-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::expm, any::data.table, any::deSolve

      - name: Clone frozen manuscript repository (read-only use)
        run: |
          git clone --quiet "$FROZEN_REPO_URL" "$RUNNER_TEMP/postexport-kinetics"
          cd "$RUNNER_TEMP/postexport-kinetics"
          test "$(git rev-parse "$FROZEN_TAG^{commit}")" = "$FROZEN_COMMIT"
          git rev-parse HEAD > "$RUNNER_TEMP/frozen_head_before"
          git status --porcelain --ignored > "$RUNNER_TEMP/frozen_status_before"
          git show-ref > "$RUNNER_TEMP/frozen_refs_before"

      - name: Export frozen tag and recompute frozen outputs on the committed inputs
        run: |
          FROZEN=$(sh tools/frozen/export_frozen.sh "$RUNNER_TEMP/postexport-kinetics" "$RUNNER_TEMP/frozen-export")
          Rscript tools/frozen/recompute_fixtures.R "$FROZEN" tests/testthat/fixtures "$RUNNER_TEMP/fixtures-linux"

      - name: Packaged benchmark metadata matches the frozen benchmark files
        run: Rscript tools/ci/check_benchmark_provenance.R "$RUNNER_TEMP/frozen-export"

      - name: Install package
        run: R CMD INSTALL .

      - name: Same-platform package vs frozen (strict, including bootstrap draws)
        env:
          POSTEXPORT_FIXTURE_DIR: ${{ runner.temp }}/fixtures-linux
        run: Rscript tools/ci/run_tests_ci.R

      - name: Cross-platform frozen comparison (scientific policy)
        if: always()
        run: Rscript tools/frozen/compare_fixtures.R tests/testthat/fixtures "$RUNNER_TEMP/fixtures-linux"

      - name: Characterise cross-platform differences (diagnostic)
        if: always()
        run: Rscript tools/ci/diagnose_platform_diffs.R tests/testthat/fixtures "$RUNNER_TEMP/fixtures-linux"

      - name: End-to-end manuscript validation script (quick)
        if: always()
        run: Rscript tools/validate_against_manuscript.R --frozen-repo "$RUNNER_TEMP/postexport-kinetics" --quick

      - name: Verify frozen repository was not modified
        if: always()
        run: |
          cd "$RUNNER_TEMP/postexport-kinetics"
          git rev-parse HEAD | diff - "$RUNNER_TEMP/frozen_head_before"
          git status --porcelain --ignored | diff - "$RUNNER_TEMP/frozen_status_before"
          git show-ref | diff - "$RUNNER_TEMP/frozen_refs_before"
          echo "Frozen repository unchanged."
