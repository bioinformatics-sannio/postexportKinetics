# R-version compatibility of the package (release-candidate requirement:
# verify the declared Depends: R (>= 4.1.0)).
#
# Separate from the scientific release gate (linux-regression.yml, current R
# release), which is unchanged.
#
# Failure interpretation (RELEASE_CANDIDATE_0.1.0.md, B.2):
#   step "Install dependencies" fails -> A. dependency / ecosystem limitation
#                                           (a CRAN dependency not installable
#                                           on this R version);
#   later steps fail                  -> B. candidate package incompatibility
#                                           (to be reported before any
#                                           DESCRIPTION change).
# The committed fixtures come from another platform, so the regression tests
# run at the cross-platform levels B/C (tools/frozen/README.md).

name: r-compat

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  R_KEEP_PKG_SOURCE: yes

jobs:
  r-compat:
    name: R ${{ matrix.r }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        r: ['4.1', 'oldrel-1']
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Record R provenance
        run: Rscript tools/ci/record_r_provenance.R "r-compat R ${{ matrix.r }}"

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::testthat, any::expm
          needs: check

      - name: Diagnose a dependency-installation failure (category A)
        if: failure()
        run: |
          Rscript -e '
            options(repos = c(CRAN = "https://cloud.r-project.org"))
            if (!requireNamespace("pak", quietly = TRUE))
              install.packages("pak", repos = sprintf(
                "https://r-lib.github.io/p/pak/stable/%s/%s/%s",
                .Platform$pkgType, R.Version()$os, R.Version()$arch))
            r <- tryCatch({ pak::lockfile_create("deps::.", lockfile = "diag.lock",
                                                 dependencies = TRUE); "resolved" },
                          error = function(e) conditionMessage(e))
            cat("PAK RESOLUTION:", r, "\n")' > diag.log 2>&1 || true
          tail -c 3000 diag.log > diag_tail.log
          MSG=$(sed -e 's/%/%25/g' diag_tail.log | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=R ${{ matrix.r }} dependency resolution::$MSG"

      - name: Session and dependency versions
        run: |
          Rscript -e 'cat(R.version.string, "\n"); for (p in c("deSolve","ggplot2","MASS","nnls","knitr","rmarkdown","testthat")) cat(sprintf("%-10s %s\n", p, as.character(packageVersion(p)))); print(La_version()); print(RNGkind())'

      - name: Install package
        run: R CMD INSTALL .

      - name: Regression tests (committed fixtures; levels B/C expected)
        run: Rscript tools/ci/run_tests_ci.R

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: false
