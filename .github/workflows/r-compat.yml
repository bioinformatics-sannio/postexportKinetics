# R-version compatibility of the package (release-candidate requirement:
# verify the declared Depends: R (>= 4.1.0)).
#
# Separate from the scientific release gate (linux-regression.yml, current R
# release), which is unchanged.
#
# Failure interpretation (RELEASE_CANDIDATE_0.1.0.md, B.2):
#   step "Install dependencies" fails -> A. dependency / ecosystem limitation
#                                           (a CRAN dependency not installable
#                                           on this R version);
#   later steps fail                  -> B. candidate package incompatibility
#                                           (to be reported before any
#                                           DESCRIPTION change).
# The committed fixtures come from another platform, so the regression tests
# run at the cross-platform levels B/C (tools/frozen/README.md).

name: r-compat

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  R_KEEP_PKG_SOURCE: yes

jobs:
  r-compat:
    name: R ${{ matrix.r }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        r: ['4.1', 'oldrel-1']
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Record R provenance
        run: Rscript tools/ci/record_r_provenance.R "r-compat R ${{ matrix.r }}"

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::testthat, any::expm
          needs: check

      - name: Diagnose a dependency-installation failure (category A)
        if: failure()
        run: |
          cat > diag.R <<'RS'
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          ann <- function(title, x) {
            x <- gsub("%", "%25", paste(utils::tail(x, 25), collapse = "\n"))
            cat(sprintf("::error title=%s::%s\n", title, gsub("\n", "%0A", x)))
          }
          if (!requireNamespace("pak", quietly = TRUE))
            install.packages("pak", repos = sprintf(
              "https://r-lib.github.io/p/pak/stable/%s/%s/%s",
              .Platform$pkgType, R.Version()$os, R.Version()$arch))
          e <- tryCatch({ pak::pkg_deps("deps::."); NULL },
                        error = function(e) e)
          ann("pak resolution (R 4.1)", if (is.null(e)) "resolved" else
            c(conditionMessage(e), if (!is.null(e$parent)) conditionMessage(e$parent)))
          if (!requireNamespace("BiocManager", quietly = TRUE))
            install.packages("BiocManager")
          cat(sprintf("::notice title=Bioconductor version for R %s::%s\n",
                      getRversion(), as.character(BiocManager::version())))
          out <- suppressWarnings(system2(
            file.path(R.home("bin"), "Rscript"),
            c("-e", shQuote(paste(
              "BiocManager::install('SummarizedExperiment', ask = FALSE,",
              "update = FALSE);",
              "cat('SummarizedExperiment installed:',",
              "requireNamespace('SummarizedExperiment', quietly = TRUE), '\\n')"))),
            stdout = TRUE, stderr = TRUE))
          ann("BiocManager SummarizedExperiment (R 4.1)", out)
          RS
          Rscript diag.R 2>&1 | grep -E "^::(error|notice)" || true

      - name: Session and dependency versions
        run: |
          Rscript -e 'cat(R.version.string, "\n"); for (p in c("deSolve","ggplot2","MASS","nnls","knitr","rmarkdown","testthat")) cat(sprintf("%-10s %s\n", p, as.character(packageVersion(p)))); print(La_version()); print(RNGkind())'

      - name: Install package
        run: R CMD INSTALL .

      - name: Regression tests (committed fixtures; levels B/C expected)
        run: Rscript tools/ci/run_tests_ci.R

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: false
